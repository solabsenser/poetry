{% extends "base.html" %}
{% block title %}Новое стихотворение — {% endblock %}
{% block content %}
<h1 class="page-title">Новое стихотворение</h1>
<form method="post" class="form new-wide">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <label>Название <input name="title" value="{{ title }}" maxlength="100" required autofocus></label>
  <label>Текст <textarea name="body" class="poem-input" maxlength="5000" required>{{ body }}</textarea></label>
  <button class="btn">Опубликовать</button>
</form>
{% endblock %}
