{% extends "base.html" %}
{% block title %}Редактировать профиль — {% endblock %}
{% block content %}
<h1 class="page-title">Редактировать профиль</h1>
<p class="page-sub">То, что увидят другие на твоей странице.</p>

<section class="panel">
  <form method="post" action="{{ url_for('edit_profile') }}" class="form form-wide">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <label>О себе <textarea name="bio" maxlength="300" rows="4" data-count="bio-count">{{ bio }}</textarea></label>
    <p class="hint counter" id="bio-count"></p>
    <div class="form-row">
      <button class="btn">Сохранить</button>
      <a href="{{ url_for('user', username=g.user.username) }}">Отмена</a>
    </div>
  </form>
</section>
<p class="hint settings-link">Пароль и тема оформления находятся в <a href="{{ url_for('settings') }}">настройках</a>.</p>
{% endblock %}
