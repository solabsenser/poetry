<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}{{ SITE_NAME }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-auth="{{ 1 if g.user else '' }}" data-csrf="{{ csrf_token() }}">
<div class="sheet">
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">{{ SITE_NAME }}</a>
    <nav>
      {% if g.user %}
        <a href="{{ url_for('new_poem') }}">Написать</a>
        <a href="{{ url_for('notifications') }}">Уведомления<span id="notif-badge" class="badge" hidden></span></a>
        <a href="{{ url_for('user', username=g.user.username) }}">{{ g.user.username }}</a>
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button class="linklike">Выйти</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Войти</a>
        <a href="{{ url_for('register') }}">Регистрация</a>
      {% endif %}
    </nav>
  </header>
  <form class="searchbar" action="{{ url_for('search') }}" method="get" role="search">
    <input type="search" name="q" value="{{ request.args.get('q', '') if request.endpoint == 'search' else '' }}" placeholder="Поиск по стихам, авторам и #тегам" aria-label="Поиск" maxlength="100">
  </form>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <p class="notice{{ ' error' if category == 'error' }}" role="status">{{ message }}</p>
    {% endfor %}
  {% endwith %}
  <main>{% block content %}{% endblock %}</main>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
